port 26379

# Monitor the master — quorum of 2 means at least 2 sentinels must agree
# before a failover is initiated.
sentinel monitor mymaster 172.28.0.10 6379 2

# How long (ms) a master must be unreachable before sentinels consider it
# subjectively down. 5 000 ms = 5 s is a reasonable production default.
sentinel down-after-milliseconds mymaster 5000

# Maximum time (ms) allowed for a failover before it is aborted and retried.
sentinel failover-timeout mymaster 30000

# How many replicas can be reconfigured to replicate from the new master at
# the same time. 1 means replicas are upgraded one by one.
sentinel parallel-syncs mymaster 1

# Announce our own address so clients can reach us via the Docker bridge IP.
sentinel announce-ip 172.28.0.20
sentinel announce-port 26379
